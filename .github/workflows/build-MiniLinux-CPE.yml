name: Build ImmortalWrt for MiniLinux-CPE

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/build-MiniLinux-CPE.yml"
      - "MiniLinux-CPE/**"

concurrency:
  group: MiniLinux-CPE-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, spi38m]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      BUILD_ROOT: ${{ github.workspace }}/.ci/immortalwrt-MiniLinux-CPE
      SOURCE_DIR: ${{ github.workspace }}/.ci/immortalwrt-MiniLinux-CPE/source
      CUSTOM_DIR: ${{ github.workspace }}/MiniLinux-CPE
      OUTPUT_DIR: ${{ github.workspace }}/output
      DL_CACHE_DIR: ${{ github.workspace }}/.ci/immortalwrt-download-cache
      BUILD_JOBS: "4"
      FIRMWARE_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout custom firmware files
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget \
            curl jq libelf-dev dwarves device-tree-compiler patch \
            ca-certificates

      - name: Restore source archive cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci/immortalwrt-download-cache
          key: immortalwrt-MiniLinux-CPE-dl-${{ matrix.variant }}-${{ hashFiles('MiniLinux-CPE/custom.config', 'MiniLinux-CPE/patches/*.patch') }}
          restore-keys: |
            immortalwrt-MiniLinux-CPE-dl-

      - name: Build firmware
        run: bash MiniLinux-CPE/build-wsl.sh

      - name: Collect diagnostic logs
        if: always()
        run: |
          mkdir -p ci-logs
          cp -f "$BUILD_ROOT"/*.log ci-logs/ 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MiniLinux-CPE-build-logs-${{ matrix.variant }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download both firmware variants
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p output
          cp -a artifacts/firmware-standard/. output/
          test "$(cat artifacts/firmware-spi38m/FIRMWARE_VARIANT)" = spi38m
          test "$(cat output/FIRMWARE_VARIANT)" = standard
          for variant in standard spi38m; do
            (cd "artifacts/firmware-$variant" && sha256sum -c SHA256SUMS)
            find "artifacts/firmware-$variant" -maxdepth 1 -name '*initramfs-kernel.bin' | grep -q .
            find "artifacts/firmware-$variant" -maxdepth 1 -name '*squashfs-sysupgrade.bin' | grep -q .
          done
          (cd artifacts/firmware-spi38m && zip -qr ../../output/MiniLinux-CPE-spi38m.zip .)
          rm -f output/sha256sums
          (
            cd output
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 -r sha256sum > SHA256SUMS
          )
          test -s output/SHA256SUMS

      - name: Publish firmware to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}-${{ github.run_attempt }}
          name: "YANG-RouterOS CI build #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            标准固件保留原有 Linux SPI Flash 10 MHz 上限。
            MiniLinux-CPE-spi38m.zip 为额外版本，Linux SPI Flash 上限为 38.33 MHz；实际频率受整数分频限制。
            两版均不修改 Breed，不能解决 Breed 启动阶段的 SPI 读取错误。详情见各产物内 VARIANTS.md。
          files: output/*
          fail_on_unmatched_files: true
